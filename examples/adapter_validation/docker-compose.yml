services:
  postgres:
    image: ${AGENTLEDGER_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${AGENTLEDGER_POSTGRES_USER:-agentledger}
      POSTGRES_PASSWORD: ${AGENTLEDGER_POSTGRES_PASSWORD:-agentledger}
      POSTGRES_DB: ${AGENTLEDGER_POSTGRES_DB:-agentledger}
    ports:
      - "127.0.0.1:${AGENTLEDGER_POSTGRES_PORT:-15432}:5432"

  minio:
    image: ${AGENTLEDGER_MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AGENTLEDGER_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AGENTLEDGER_MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${AGENTLEDGER_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${AGENTLEDGER_MINIO_CONSOLE_PORT:-19001}:9001"

  minio-setup:
    image: ${AGENTLEDGER_MC_IMAGE:-minio/mc:latest}
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >-
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}" &&
          mc mb --ignore-existing "local/$${AGENTLEDGER_S3_BUCKET:-agentledger-runs}" &&
          exit 0;
          sleep 2;
        done;
        exit 1
    environment:
      MINIO_ROOT_USER: ${AGENTLEDGER_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AGENTLEDGER_MINIO_ROOT_PASSWORD:-minioadmin}
      AGENTLEDGER_S3_BUCKET: ${AGENTLEDGER_S3_BUCKET:-agentledger-runs}
